openapi: 3.1.0
info:
  title: pmcaFilesystemServer Sync API
  version: 1.0.0
  description: >
    Small camera-side sync API for Sony OpenMemories / PlayMemories cameras.
    All machine endpoints return text/plain except file downloads.
servers:
  - url: http://{cameraIp}:8080
    variables:
      cameraIp:
        default: 192.168.12.220
        description: Camera LAN IP address.
paths:
  /api/v1/hello.txt:
    get:
      summary: Probe the sync API
      description: >
        Returns protocol, device, and capability metadata as plain text.
        The server also accepts /api/v1/hello as an alias.
      responses:
        "200":
          description: Protocol and device metadata.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    protocol,pmca-sync,1
                    device,Sony,ILCE-6000
                    limits,100,200
                    capabilities,text,cursor,status,singleton
  /api/v1/cursor/create.txt:
    post:
      summary: Create the singleton cursor
      description: >
        Starts a background scan for the requested filter set. If a session is
        already active, the server returns 409 unless force=1 is supplied.
      parameters:
        - name: modified_after
          in: query
          description: Lower bound in epoch milliseconds.
          schema:
            type: integer
            format: int64
        - name: prefix
          in: query
          description: Path prefix under the camera storage root.
          schema:
            type: string
        - name: kind
          in: query
          description: File kind filter. If omitted, the cursor defaults to media only: image, raw, and video. Use all to include other files too.
          schema:
            type: string
            enum: [all, image, raw, video, other]
        - name: force
          in: query
          description: If truthy, replace the active session.
          schema:
            type: string
      responses:
        "202":
          description: Cursor created and scan started.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    cursor,1
                    status,scanning
                    matched,0
                    scanned,0
                    emitted,0
                    remaining,0
        "400":
          description: Invalid query parameter.
          content:
            text/plain:
              schema:
                type: string
              examples:
                invalidKind:
                  value: invalid kind
                invalidPrefix:
                  value: invalid prefix
        "409":
          description: A session is already active and force was not requested.
          content:
            text/plain:
              schema:
                type: string
              examples:
                busy:
                  value: |
                    cursor,1
                    status,scanning
                    matched,42
                    scanned,98
                    emitted,0
                    remaining,42
  /api/v1/cursor/status.txt:
    get:
      summary: Report cursor state
      description: >
        Returns non-blocking cursor status as plain text.
        The server also accepts /api/v1/status as an alias.
      responses:
        "200":
          description: Current cursor state.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    cursor,1
                    status,ready
                    matched,245
                    scanned,9823
                    emitted,100
                    remaining,145
  /api/v1/cursor/files.txt:
    get:
      summary: Fetch a paginated cursor page
      description: >
        Returns one bounded page of file metadata from the active cursor.
        The server also accepts /api/v1/files as an alias.
      parameters:
        - name: limit
          in: query
          description: Requested page size, capped by the server.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: A paginated metadata page.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    # pmca-sync cursor v=1 cursor=1 status=ready limit=100 count=1 has_more=1 matched=245 scanned=9823 emitted=100 remaining=145 format=tsv fields=path,mtime,size,kind encoding=backslash
                    /storage/sdcard0/DCIM/100MSDCF/DSC01234.ARW	1719850000123	24891234	raw
        "409":
          description: No ready cursor is available yet.
          content:
            text/plain:
              schema:
                type: string
              examples:
                busy:
                  value: |
                    cursor,1
                    status,scanning
                    matched,42
                    scanned,98
                    emitted,0
                    remaining,42
        "500":
          description: Cursor scan failed.
          content:
            text/plain:
              schema:
                type: string
              examples:
                error:
                  value: |
                    cursor,1
                    status,error
                    matched,0
                    scanned,0
                    emitted,0
                    remaining,0
                    error,IllegalStateException
  /api/v1/cursor/close.txt:
    post:
      summary: Close the active cursor
      description: >
        Cancels the current cursor session and releases its matched arrays.
        The server also accepts /api/v1/cursor/close as an alias.
      responses:
        "200":
          description: Cursor closed or already idle.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    cursor,1
                    status,closed
                    matched,245
                    scanned,9823
                    emitted,100
                    remaining,145
  /api/v1/file.txt:
    get:
      summary: Fetch metadata for one file
      description: >
        Returns one metadata record for a single file. The server also accepts
        /api/v1/file as an alias.
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute file path on the camera.
          schema:
            type: string
      responses:
        "200":
          description: Metadata for the requested file.
          content:
            text/plain:
              schema:
                type: string
              examples:
                default:
                  value: |
                    # pmca-sync file v=1
                    /storage/sdcard0/DCIM/100MSDCF/DSC01234.ARW	1719850000123	24891234	raw
        "400":
          description: Missing required path parameter.
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingPath:
                  value: missing path
        "404":
          description: The file does not exist on the camera.
          content:
            text/plain:
              schema:
                type: string
              examples:
                notFound:
                  value: not found
  /api/v1/download:
    get:
      summary: Stream one file
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute file path on the camera.
          schema:
            type: string
      responses:
        "200":
          description: File bytes streamed with the camera-detected MIME type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing required path parameter.
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingPath:
                  value: missing path
        "404":
          description: The file does not exist on the camera.
          content:
            text/plain:
              schema:
                type: string
              examples:
                notFound:
                  value: not found
  /api/v1/status.txt:
    get:
      summary: Report coarse cursor state
      description: >
        Returns non-blocking cursor information about the camera-side index.
        The server also accepts /api/v1/status as an alias.
      responses:
        "200":
          description: Current camera-side state.
          content:
            text/plain:
              schema:
                type: string
              examples:
                ready:
                  value: |
                    cursor,1
                    status,ready
                    matched,245
                    scanned,9823
                    emitted,100
                    remaining,145
